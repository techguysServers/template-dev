name: Security

# Sécurité supply-chain & code. Tourne sur les PR vers main/dev + hebdo.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC

permissions:
  contents: read
  security-events: write # pour remonter dans l'onglet Security

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets leakés dans l'historique / le diff ──────────────────────────────
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Analyse statique du code (SAST) ─────────────────────────────────────────
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Ajoute python / java / csharp / go selon le backend du projet
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  # ── Vulnérabilités des dépendances & du système de fichiers ─────────────────
  trivy:
    name: Vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1" # casse la CI si une faille HIGH/CRITICAL est trouvée
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── Revue des dépendances ajoutées dans la PR ──────────────────────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
