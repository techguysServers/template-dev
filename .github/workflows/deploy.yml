name: Deploy

# Template de déploiement. DÉCOMMENTE le bloc correspondant à ta cible.
#   dev  → staging (auto)
#   main → production (auto, ou protégé par "environments" + approbation)
#
# Configure les "Environments" GitHub (Settings → Environments) :
#   · staging     : secrets de staging
#   · production  : secrets de prod + required reviewers (approbation manuelle)
#
# ⚠️ Vérifie la dernière version des actions sur leurs repos officiels.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

